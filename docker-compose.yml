services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: assistant-postgres
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant
      POSTGRES_DB: assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  loki:
    image: grafana/loki:latest
    container_name: assistant-loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki.yml:/etc/loki/loki.yml:ro
    command: -config.file=/etc/loki/loki.yml

  promtail:
    image: grafana/promtail:latest
    container_name: assistant-promtail
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      - ./logs:/var/log/assistant:ro
    command: -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki

  prometheus:
    image: prom/prometheus:latest
    container_name: assistant-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: assistant-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  postgres_data:
  grafana_data:
