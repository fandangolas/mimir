linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam

linters-settings:
  goimports:
    local-prefixes: github.com/fandangolas/personal-assistant

issues:
  exclude-rules:
    - path: "_test.go"
      linters:
        - errcheck
